<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Box</title>

  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">

  <style>

    h1{
      text-align: center;
      font-family: cursive;
    }

    .container{
      height: 150px;
      width: 150px;
      margin: 100px auto;
      position: relative;
    }

    .items{
      height: inherit;
      width: inherit;
      position: absolute;
      top: 0;
      left: 0;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 1s linear;
    }

    .item-1{
      background-color: blue;
      color: white;
    }

    .item-2{
      background-color: rgb(242, 6, 116);
      color: white;
    }

    .item-3{
      background-color: rgb(16, 209, 48);
      color: white;
    }

    .item-4{
      background-color: rgb(232, 206, 11);
      color: white;
    }

    .container:hover > .item-1{
      transform: translateX(200px) rotate(360deg);
    }

    .container:hover > .item-2{
      transform: translateY(200px) rotate(360deg);
      transition-delay: 0.5s;
    }

    .container:hover > .item-3{
      transform: translateX(-200px) rotate(360deg);
      transition-delay: 1s;
    }

    .container:hover > .item-4{
      transform: translateY(-200px) rotate(360deg);
      transition-delay: 1.5s;
    }

  </style>
</head>

<body>

  <h1>Hover Animation</h1>

  <div class="container">
    <div class="items item-1">Item 1</div>
    <div class="items item-2">Item 2</div>
    <div class="items item-3">Item 3</div>
    <div class="items item-4">Item 4</div>
  </div>

</body>
</html>
